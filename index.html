<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <main class="calculadora">
    <img src="pex.jpg" alt="Logo IMC" class="logo">
    <h1>Calculadora de IMC</h1>   
    <h4>Digite seu peso e Altura:</h4>
    
    <form onsubmit="return false;">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" placeholder="Ex: 70" step="any" min="0">

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" placeholder="Ex: 1.75" step="any" min="0">

        
        <button type="button" onclick="calcularIMC()">Calcular</button>

        <div id="resultado"></div>
        </main>


  <script src="script.js"></script>

<footer class="rodape">
          <p><strong>Desenvolvido por: Jhonny Klisman</strong></p>
        </footer>


  </body>
</html>
